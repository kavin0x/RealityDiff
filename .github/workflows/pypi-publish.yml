name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"

      - name: Run tests
        run: uv run --extra dev pytest -q

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"

      - name: Check release tag matches pyproject version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match pyproject version v$version" >&2
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Check package contents
        run: |
          for whl in dist/*.whl; do
            bad=$(unzip -Z1 "$whl" | grep -v -E '^(realitydiff/|realitydiff-[^/]*\.dist-info/)' || true)
            if [ -n "$bad" ]; then
              echo "Unexpected files in wheel:" >&2
              echo "$bad" >&2
              exit 1
            fi
          done
          secrets=$( { unzip -Z1 dist/*.whl; tar tzf dist/*.tar.gz; } | grep -E '(^|/)(\.env[^/]*|[^/]*\.(pem|key))$' || true)
          if [ -n "$secrets" ]; then
            echo "Secret-looking files in the package:" >&2
            echo "$secrets" >&2
            exit 1
          fi

      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/realitydiff
    permissions:
      id-token: write
      attestations: write
      contents: read
      actions: read
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
